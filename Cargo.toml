[workspace]
members = [
    "crates/osdl-core",
    "crates/osdl-parser",
    "crates/osdl-codegen",
    "crates/osdl-codegen-seaorm",
    "crates/osdl-codegen-mongo",
    "crates/osdl-migrator",
    "crates/osdl-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["OSDL Contributors"]
repository = "https://github.com/example/osdl"
rust-version = "1.85"

[workspace.dependencies]
# CLI & UX
clap = { version = "4.6", features = ["derive"] }
miette = { version = "7.6", features = ["fancy"] }
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Parsing & AST
pest = "2.9"
pest_derive = "2.9"
la-arena = "0.3.1"

# Code Generation
syn = { version = "3.0", features = ["full", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.3"

# Lockfile & Diffing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

# Database Execution
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }
sea-orm-migration = "2.0"
mongodb = "3.8"
tokio = { version = "1.53", features = ["full"] }

# Testing & benchmarking
insta = "1.48"
proptest = "1.4"
criterion = "0.8"

# Internal crates
osdl-core = { path = "crates/osdl-core" }
osdl-parser = { path = "crates/osdl-parser" }
osdl-codegen = { path = "crates/osdl-codegen" }
osdl-codegen-seaorm = { path = "crates/osdl-codegen-seaorm" }
osdl-codegen-mongo = { path = "crates/osdl-codegen-mongo" }
osdl-migrator = { path = "crates/osdl-migrator" }
