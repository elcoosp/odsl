[workspace]
members = [
    "crates/osdl-core",
    "crates/osdl-parser",
    "crates/osdl-codegen",
    "crates/osdl-codegen-seaorm",
    "crates/osdl-codegen-mongo",
    "crates/osdl-codegen-typescript",
    "crates/osdl-codegen-graphql",
    "crates/osdl-codegen-openapi",
    "crates/osdl-codegen-erd",
    "crates/osdl-codegen-jsonschema",
    "crates/osdl-codegen-ts-validators",
    "crates/osdl-codegen-prisma",
    "crates/osdl-codegen-drizzle",
    "crates/osdl-codegen-trpc",
    "crates/osdl-bench",
    "crates/osdl-migrator",
    "crates/osdl-adapter",
    "crates/osdl-cli",
    "crates/osdl-lsp",
    "crates/osdl-mcp",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["OSDL Contributors"]
repository = "https://github.com/example/osdl"
rust-version = "1.85"

[workspace.dependencies]
# CLI & UX
clap = { version = "4.6.6", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
notify = "8.2.0"

# Parsing & AST
pest = "2.9.0"
pest_derive = "2.9.0"
la-arena = "0.3.1"

# Code Generation
syn = { version = "3.0.3", features = ["full", "parsing"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
prettyplease = "0.3.0"

# Lockfile & Diffing
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1"

# Database Execution
sea-orm = { version = "2.0.2", features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-native-tls"] }
sea-orm-migration = "2.0.2"
mongodb = "3.8.0"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }

# Language Server
async-lsp = { version = "0.2.4", features = ["async-io"] }

# Testing & benchmarking
insta = "1.48.0"
proptest = "1.11.0"
criterion = "0.8.2"

# LSP / async companions (literal pins in osdl-lsp)
async-io = "2.6.0"
futures = "0.3.34"
async-channel = "2.5.0"

# Integration test harness (osdl-adapter dev-deps)
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mongo"] }

# Internal crates
osdl-core = { path = "crates/osdl-core" }
osdl-parser = { path = "crates/osdl-parser" }
osdl-codegen = { path = "crates/osdl-codegen" }
osdl-codegen-seaorm = { path = "crates/osdl-codegen-seaorm" }
osdl-codegen-mongo = { path = "crates/osdl-codegen-mongo" }
osdl-codegen-typescript = { path = "crates/osdl-codegen-typescript" }
osdl-codegen-graphql = { path = "crates/osdl-codegen-graphql" }
osdl-codegen-openapi = { path = "crates/osdl-codegen-openapi" }
osdl-codegen-erd = { path = "crates/osdl-codegen-erd" }
osdl-codegen-jsonschema = { path = "crates/osdl-codegen-jsonschema" }
osdl-codegen-ts-validators = { path = "crates/osdl-codegen-ts-validators" }
osdl-codegen-prisma = { path = "crates/osdl-codegen-prisma" }
osdl-codegen-drizzle = { path = "crates/osdl-codegen-drizzle" }
osdl-codegen-trpc = { path = "crates/osdl-codegen-trpc" }
osdl-migrator = { path = "crates/osdl-migrator" }
osdl-adapter = { path = "crates/osdl-adapter" }
osdl-lsp = { path = "crates/osdl-lsp" }
osdl-mcp = { path = "crates/osdl-mcp" }
