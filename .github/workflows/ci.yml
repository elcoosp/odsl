name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, no warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test (no live DB)
        # Live Postgres/Mongo integration tests need Docker; they are skipped
        # here and covered by the `integration` job below.
        run: cargo test --workspace --lib

  integration:
    name: Integration tests (Postgres + Mongo via testcontainers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: osdl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run adapter integration tests
        run: cargo test -p osdl-adapter --test live_postgres_mongo
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/osdl_test

  docs:
    name: Docs / links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify referenced docs exist
        run: |
          test -f docs/backend-matrix.md
          test -d docs/adrs
          test -f docs/getting-started.md
          test -f docs/migration-guide.md

  bench:
    name: Performance benchmark (SLO gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run pipeline SLO tests (100 models < 500ms)
        # These assert REQ-NFR-PERF-001 / RTM R-04 and fail CI on regression.
        run: cargo test -p osdl-bench
