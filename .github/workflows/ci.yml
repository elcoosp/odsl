name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Never auto-update insta snapshots in CI; a drift must fail the build so it
  # is reviewed as a diff.
  INSTA_UPDATE: "no"

permissions:
  contents: read

jobs:
  fmt:
    name: Format (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint (cargo clippy -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  test:
    name: Unit & snapshot tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--lib` runs every crate's unit tests, including the insta codegen
      # snapshot assertions (e.g. osdl-codegen-seaorm). No live database needed.
      - run: cargo test --workspace --lib

  integration:
    name: Adapter integration (Postgres + Mongo via testcontainers)
    runs-on: ubuntu-latest
    needs: [build]
    # GitHub-hosted runners ship a Docker daemon; testcontainers spins up the
    # Postgres and Mongo containers the live tests connect to.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run live adapter tests
        run: cargo test -p osdl-adapter --test live_postgres_mongo

  bench:
    name: Performance SLO gate (Parse→Validate→Render < 500ms)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Asserts REQ-NFR-PERF-001 / RTM R-04 (100 models < 500ms). Fails CI on
      # any regression.
      - run: cargo test -p osdl-bench

  docs:
    name: Documentation existence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify referenced docs exist
        run: |
          test -f docs/backend-matrix.md
          test -d docs/adrs
          test -f docs/getting-started.md
          test -f docs/migration-guide.md

  audit:
    name: Dependency audit (cargo audit / RUSTSEC)
    runs-on: ubuntu-latest
    # Audit must be allowed to read the repo and open issues if configured;
    # read-only here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Fast gate that every PR must pass; the heavy jobs run in parallel above.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, clippy, build, test, integration, bench, docs, audit]
    steps:
      - name: Fail if any required job failed
        run: |
          echo "fmt=${{ needs.fmt.result }} clippy=${{ needs.clippy.result }} build=${{ needs.build.result }}"
          echo "test=${{ needs.test.result }} integration=${{ needs.integration.result }} bench=${{ needs.bench.result }}"
          echo "docs=${{ needs.docs.result }} audit=${{ needs.audit.result }}"
          if [ "${{ needs.fmt.result }}" != "success" ] || \
             [ "${{ needs.clippy.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.bench.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed."
